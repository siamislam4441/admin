<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Manage Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
    <style>
        body { background-color: #eef2f5; font-family: Arial, sans-serif; padding-bottom: 40px; }
        .admin-card { max-width: 650px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-title { background: #14A44D; color: white; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 20px; }
        .delete-card { max-width: 650px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; border-left: 5px solid #dc3545; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <!-- Entry Form -->
    <div class="admin-card">
        <div class="header-title">
            <h3>Admin Panel</h3>
            <p class="m-0">Add New Student / Subject Result</p>
        </div>

        <form id="resultForm">
            <div class="form-group">
                <label><strong>Roll Number:</strong></label>
                <input type="number" id="roll" class="form-control" placeholder="Enter Roll Number" required>
            </div>

            <div class="form-group">
                <label><strong>Student Name:</strong></label>
                <input type="text" id="name" class="form-control" placeholder="Enter Student Name" required>
            </div>

            <div class="form-group">
                <label><strong>Total GPA:</strong></label>
                <input type="text" id="gpa" class="form-control" placeholder="e.g. 5.00" required>
            </div>

            <hr>

            <div class="form-group">
                <label><strong>Select Subject:</strong></label>
                <select id="subject" class="form-control" required>
                    <option value="">-- Choose Subject --</option>
                    <option value="BANGLA">Bangla</option>
                    <option value="ENGLISH">English</option>
                    <option value="MATHEMATICS">Mathematics</option>
                    <option value="BANGLADESH & GLOBAL STUDIES">Bangladesh & Global Studies</option>
                    <option value="ISLAM & MORAL EDUCATION">Islam & Moral Education</option>
                    <option value="PHYSICS">Physics</option>
                    <option value="CHEMISTRY">Chemistry</option>
                    <option value="BIOLOGY">Biology</option>
                    <option value="HIGHER MATHEMATICS">Higher Mathematics</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label><strong>Marks:</strong></label>
                    <input type="number" id="marks" class="form-control" placeholder="e.g. 85" required>
                </div>
                <div class="form-group col-md-6">
                    <label><strong>Grade:</strong></label>
                    <select id="grade" class="form-control" required>
                        <option value="">-- Select Grade --</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-success btn-block">Add Subject Result</button>
        </form>

        <div id="statusMsg" class="mt-3 text-center"></div>
    </div>

    <!-- Delete Section -->
    <div class="delete-card">
        <h5 class="text-danger">Delete Student Result</h5>
        <p class="text-muted small">কোনো রোলের সমস্ত তথ্য ও রেজাল্ট শিট থেকে মুছে ফেলতে রোল নম্বর দিয়ে Delete চাপুন।</p>
        <div class="form-inline">
            <input type="number" id="deleteRoll" class="form-control mr-2" style="flex: 1;" placeholder="Enter Roll to Delete">
            <button type="button" onclick="deleteStudentResult()" class="btn btn-danger">Delete Result</button>
        </div>
        <div id="deleteStatus" class="mt-2"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrIkVaHpNz483PsAlvT4bCpM7IiWIfz3jxvLCanJUJ6dFBHxmzulhLEH09dPxwXLQqCQ/exec";

    // নতুন রেজাল্ট সেভ করা
    document.getElementById('resultForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        const payload = {
            action: "add",
            roll: document.getElementById('roll').value.trim(),
            name: document.getElementById('name').value.trim(),
            gpa: document.getElementById('gpa').value.trim(),
            subject: document.getElementById('subject').value,
            marks: document.getElementById('marks').value.trim(),
            grade: document.getElementById('grade').value
        };

        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Add Subject Result";
            statusMsg.innerHTML = '<div class="alert alert-success">Result Added Successfully!</div>';
            
            document.getElementById('subject').value = '';
            document.getElementById('marks').value = '';
            document.getElementById('grade').value = '';
        })
        .catch(error => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Add Subject Result";
            statusMsg.innerHTML = '<div class="alert alert-danger">Error submitting data!</div>';
        });
    });

    // রোল অনুযায়ী আগের রেজাল্ট মুছে ফেলা
    function deleteStudentResult() {
        const roll = document.getElementById('deleteRoll').value.trim();
        const deleteStatus = document.getElementById('deleteStatus');

        if (!roll) {
            alert("Please enter a Roll Number to delete!");
            return;
        }

        if (!confirm("Are you sure you want to delete all records for Roll: " + roll + "?")) {
            return;
        }

        deleteStatus.innerHTML = '<span class="text-info">Deleting...</span>';

        const payload = {
            action: "delete",
            roll: roll
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            deleteStatus.innerHTML = '<div class="alert alert-warning">Delete request sent for Roll: ' + roll + '</div>';
            document.getElementById('deleteRoll').value = '';
        })
        .catch(error => {
            deleteStatus.innerHTML = '<div class="alert alert-danger">Error deleting record!</div>';
        });
    }
</script>

</body>
</html>
