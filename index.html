<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Manage Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
    <style>
        body { background-color: #eef2f5; font-family: Arial, sans-serif; padding-bottom: 50px; }
        .admin-card { max-width: 800px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-title { background: #14A44D; color: white; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 20px; }
        .delete-card { max-width: 800px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; border-left: 5px solid #dc3545; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-tabs .nav-link.active { font-weight: bold; color: #14A44D; }
        .tab-content { padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-card">
        <div class="header-title">
            <h3>Admin Panel</h3>
            <p class="m-0">Student Result Entry System</p>
        </div>

        <!-- Student Basic Info -->
        <div class="form-row">
            <div class="form-group col-md-4">
                <label><strong>Roll Number:</strong></label>
                <input type="number" id="roll" class="form-control" placeholder="Enter Roll Number" required>
            </div>
            <div class="form-group col-md-5">
                <label><strong>Student Name:</strong></label>
                <input type="text" id="name" class="form-control" placeholder="Enter Student Name" required>
            </div>
            <div class="form-group col-md-3">
                <label><strong>Total GPA:</strong></label>
                <input type="text" id="gpa" class="form-control" placeholder="e.g. 5.00" required>
            </div>
        </div>

        <hr>

        <!-- Entry Mode Tabs -->
        <ul class="nav nav-tabs" id="entryTab" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="all-tab" data-toggle="tab" href="#allSubjects" role="tab">একসাথে সব বিষয় যোগ করুন</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="single-tab" data-toggle="tab" href="#singleSubject" role="tab">আলাদা ১টি বিষয় যোগ করুন</a>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Mode 1: All Subjects Bulk Entry -->
            <div class="tab-pane fade show active" id="allSubjects" role="tabpanel">
                <form id="bulkForm">
                    <p class="text-muted small">যে বিষয়গুলোর ফলাফল দিতে চান সেগুলোর মার্কস ও গ্রেড লিখে নিচে Submit চাপুন:</p>
                    
                    <div id="bulkSubjectRows">
                        <!-- BANGLA -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="BANGLA" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- ENGLISH -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="ENGLISH" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- MATHEMATICS -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="MATHEMATICS" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- BANGLADESH & GLOBAL STUDIES -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="BANGLADESH & GLOBAL STUDIES" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- ISLAM & MORAL EDUCATION -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="ISLAM & MORAL EDUCATION" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- PHYSICS -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="PHYSICS" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- CHEMISTRY -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="CHEMISTRY" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                        <!-- BIOLOGY -->
                        <div class="form-row mb-2 align-items-center">
                            <div class="col-md-5"><input type="text" class="form-control sub-name" value="BIOLOGY" readonly></div>
                            <div class="col-md-3.5 col-6"><input type="number" class="form-control sub-marks" placeholder="Marks"></div>
                            <div class="col-md-3.5 col-6">
                                <select class="form-control sub-grade">
                                    <option value="">Grade</option>
                                    <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                    <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="submitBulkData()" class="btn btn-success btn-block mt-3">Submit All Results</button>
                </form>
            </div>

            <!-- Mode 2: Single Subject Entry -->
            <div class="tab-pane fade" id="singleSubject" role="tabpanel">
                <form id="singleForm" onsubmit="submitSingleData(event)">
                    <div class="form-group">
                        <label><strong>Select Subject:</strong></label>
                        <select id="single_subject" class="form-control" required>
                            <option value="">-- Choose Subject --</option>
                            <option value="BANGLA">BANGLA</option>
                            <option value="ENGLISH">ENGLISH</option>
                            <option value="MATHEMATICS">MATHEMATICS</option>
                            <option value="BANGLADESH & GLOBAL STUDIES">BANGLADESH & GLOBAL STUDIES</option>
                            <option value="ISLAM & MORAL EDUCATION">ISLAM & MORAL EDUCATION</option>
                            <option value="PHYSICS">PHYSICS</option>
                            <option value="CHEMISTRY">CHEMISTRY</option>
                            <option value="BIOLOGY">BIOLOGY</option>
                            <option value="HIGHER MATHEMATICS">HIGHER MATHEMATICS</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label><strong>Marks:</strong></label>
                            <input type="number" id="single_marks" class="form-control" placeholder="e.g. 85" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label><strong>Grade:</strong></label>
                            <select id="single_grade" class="form-control" required>
                                <option value="">-- Select Grade --</option>
                                <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
                                <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="F">F</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Add Single Subject Result</button>
                </form>
            </div>
        </div>

        <div id="statusMsg" class="mt-3 text-center"></div>
    </div>

    <!-- Delete Section -->
    <div class="delete-card">
        <h5 class="text-danger">Delete Student Result</h5>
        <div class="form-inline">
            <input type="number" id="deleteRoll" class="form-control mr-2" style="flex: 1;" placeholder="Enter Roll to Delete">
            <button type="button" onclick="deleteStudentResult()" class="btn btn-danger">Delete Result</button>
        </div>
        <div id="deleteStatus" class="mt-2"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrIkVaHpNz483PsAlvT4bCpM7IiWIfz3jxvLCanJUJ6dFBHxmzulhLEH09dPxwXLQqCQ/exec";

    // ১. এক সাথে সব বিষয় যোগ করার লজিক
    function submitBulkData() {
        const roll = document.getElementById('roll').value.trim();
        const name = document.getElementById('name').value.trim();
        const gpa = document.getElementById('gpa').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (!roll || !name || !gpa) {
            alert("Please fill Roll, Name and GPA first!");
            return;
        }

        const subjects = [];
        const rows = document.querySelectorAll('#bulkSubjectRows .form-row');

        rows.forEach(row => {
            const subName = row.querySelector('.sub-name').value;
            const subMarks = row.querySelector('.sub-marks').value.trim();
            const subGrade = row.querySelector('.sub-grade').value;

            if (subMarks !== "" && subGrade !== "") {
                subjects.push({ name: subName, marks: subMarks, grade: subGrade });
            }
        });

        if (subjects.length === 0) {
            alert("Please enter marks & grade for at least one subject!");
            return;
        }

        sendData({ action: "add", roll, name, gpa, subjects });
    }

    // ২. আলাদা ১টি বিষয় যোগ করার লজিক
    function submitSingleData(e) {
        e.preventDefault();
        const roll = document.getElementById('roll').value.trim();
        const name = document.getElementById('name').value.trim();
        const gpa = document.getElementById('gpa').value.trim();

        if (!roll || !name || !gpa) {
            alert("Please fill Roll, Name and GPA first!");
            return;
        }

        const subjects = [{
            name: document.getElementById('single_subject').value,
            marks: document.getElementById('single_marks').value.trim(),
            grade: document.getElementById('single_grade').value
        }];

        sendData({ action: "add", roll, name, gpa, subjects });
    }

    // ডাটা ব্যাকএন্ডে পাঠানোর কমন ফাংশন
    function sendData(payload) {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerHTML = '<span class="text-info">Saving data to Google Sheet...</span>';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusMsg.innerHTML = '<div class="alert alert-success">Result Added Successfully!</div>';
            // রিসেট সিঙ্গেল ফিল্ডস
            document.getElementById('single_subject').value = '';
            document.getElementById('single_marks').value = '';
            document.getElementById('single_grade').value = '';
        })
        .catch(error => {
            statusMsg.innerHTML = '<div class="alert alert-danger">Error submitting data!</div>';
        });
    }

    // ৩. রোল ডিলিট করার লজিক
    function deleteStudentResult() {
        const roll = document.getElementById('deleteRoll').value.trim();
        const deleteStatus = document.getElementById('deleteStatus');

        if (!roll) {
            alert("Please enter a Roll Number!");
            return;
        }

        if (!confirm("Are you sure to delete Roll: " + roll + "?")) return;

        deleteStatus.innerHTML = '<span class="text-info">Deleting...</span>';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "delete", roll: roll })
        })
        .then(() => {
            deleteStatus.innerHTML = '<div class="alert alert-warning">Delete request sent for Roll: ' + roll + '</div>';
            document.getElementById('deleteRoll').value = '';
        })
        .catch(error => {
            deleteStatus.innerHTML = '<div class="alert alert-danger">Error deleting record!</div>';
        });
    }
</script>

</body>
</html>
